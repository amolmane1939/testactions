name: python app
on:
    push: 
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    tests:
        runs-on: ubuntu-latest

        steps:
            - name: check out code
              uses: actions/checkout@v2
            
            - name: Set up python
              uses: actions/setup-python@v2
              with:
                python-version: '3.8'
            
            - name: install dependencies
              run:
                python -m pip install --upgrade pip
                pip install -r requirement.txt
            
            - name: run tests
              run: pytest

